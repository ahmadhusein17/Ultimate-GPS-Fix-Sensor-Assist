# ==========================================
# 1. ULTIMATE NTP SERVERS (Stratum 1 & Anycast)
# ==========================================
NTP_SERVER=time.google.com
NTP_SERVER=time.cloudflare.com
NTP_SERVER=time.apple.com
NTP_SERVER=pool.ntp.org
NTP_SERVER=0.pool.ntp.org
NTP_SERVER=1.pool.ntp.org

# ==========================================
# 2. SUPL & AGPS SERVERS (Bypass Pembatasan)
# ==========================================
SUPL_HOST=supl.google.com
SUPL_PORT=7275
# SUPL_VER 2.0 untuk dukungan jaringan 4G/LTE/5G penuh
SUPL_VER=0x20000
SUPL_MODE=1
USE_EMERGENCY_PDN_FOR_EMERGENCY_SUPL=1

# ==========================================
# 3. GNSS CONSTELLATIONS (Mengaktifkan Semua Satelit)
# ==========================================
# Memaksa aktivasi GLONASS, Galileo, Beidou, QZSS, SBAS
GNSS_DEPLOYMENT=1
A_GLONASS_POS_PROTOCOL_SELECT=0xF
GPS_LOCK=0

# ==========================================
# 4. CAPABILITIES & HARDWARE ASSIST (Performa Maksimal)
# ==========================================
# 0x7F = Mengaktifkan semua kapabilitas MSA, MSB, SCHEDULING, ULP
CAPABILITIES=0x7F
# LPP Profile 3 = Menggunakan Control Plane dan User Plane
LPP_PROFILE=3

# ==========================================
# 5. SENSOR ASSISTANCE (Bantuan Gyro/Accelerometer)
# ==========================================
# Menggunakan sensor HP untuk memprediksi arah saat sinyal satelit lemah (misal: di terowongan)
SENSOR_USAGE=1
SENSOR_PROVIDER=1
SENSOR_CONTROL_MODE=0

# ==========================================
# 6. AGGRESSIVE LOCKING (Waktu Kunci Tercepat)
# ==========================================
ENABLE_XTRA=1
XTRA_SERVER_1=https://xtrapath4.izatcloud.net/xtra2.bin
XTRA_SERVER_2=https://xtrapath2.izatcloud.net/xtra2.bin
XTRA_SERVER_3=https://xtrapath3.izatcloud.net/xtra2.bin

# Langsung tampilkan lokasi tanpa menunggu kalkulasi presisi 100%
INTERMEDIATE_POS=1
ACCURACY_THRES=0

# Mengaktifkan Wi-Fi & Cell Tower Positioning
ENABLE_WIPER=1
NMEA_PROVIDER=1

# Mengizinkan network-initiated positioning
ENABLE_NI=1
